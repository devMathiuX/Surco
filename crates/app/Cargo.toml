[package]
name = "surco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reproductor de música ultraliviano: playlists de Spotify, audio desde YouTube."

authors = ["mathiux"]
homepage = "https://github.com/devMathiuX/Surco"
readme = "../../README.md"

[package.metadata.deb]
name = "surco"
maintainer = "mathiux"
copyright = "mathiux"
section = "sound"
priority = "optional"
extended-description = """\
Importa playlists de Spotify y reproduce cada canción usando YouTube como \
fuente de audio (vía yt-dlp). Liviano: menos de 80 MB de RAM."""
# $auto agrega libasound2 y libc; libxkbcommon la carga winit en tiempo de ejecución.
depends = "$auto, libxkbcommon0"
# El yt-dlp de las distros suele estar viejo y YouTube lo rompe: Surco ofrece
# bajar el oficial. Por eso solo se sugiere.
suggests = "yt-dlp, deno"
assets = [
    ["target/release/surco", "usr/bin/", "755"],
    ["../../packaging/linux/surco.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/surco-16.png", "usr/share/icons/hicolor/16x16/apps/surco.png", "644"],
    ["../../packaging/icons/surco-32.png", "usr/share/icons/hicolor/32x32/apps/surco.png", "644"],
    ["../../packaging/icons/surco-48.png", "usr/share/icons/hicolor/48x48/apps/surco.png", "644"],
    ["../../packaging/icons/surco-64.png", "usr/share/icons/hicolor/64x64/apps/surco.png", "644"],
    ["../../packaging/icons/surco-128.png", "usr/share/icons/hicolor/128x128/apps/surco.png", "644"],
    ["../../packaging/icons/surco-256.png", "usr/share/icons/hicolor/256x256/apps/surco.png", "644"],
    ["../../packaging/icons/surco-512.png", "usr/share/icons/hicolor/512x512/apps/surco.png", "644"],
    ["../../README.md", "usr/share/doc/surco/README.md", "644"],
]

[[bin]]
name = "surco"
path = "src/main.rs"

[dependencies]
surco-core.workspace = true
surco-spotify.workspace = true
surco-resolver.workspace = true
surco-provider.workspace = true
surco-player.workspace = true
surco-storage.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
iced.workspace = true
tokio.workspace = true
directories.workspace = true
serde.workspace = true
toml.workspace = true
image.workspace = true
souvlaki.workspace = true
rfd.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Render por GPU (wgpu). Desactivado por defecto: suma ~3 MB al binario y
# 50-100 MB de RAM por los drivers. Ver README, "Render".
gpu = ["iced/wgpu"]

[lints]
workspace = true
