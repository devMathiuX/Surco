# Licencias de las dependencias que se aceptan en los binarios de Surco.
# `cargo about generate --locked about.hbs -o THIRD_PARTY_LICENSES.html`
# arma la lista con el texto de cada licencia (lo hace el workflow de release).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "OpenSSL",
]
# Solo lo que va dentro del binario (no las de desarrollo ni las de compilación).
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
