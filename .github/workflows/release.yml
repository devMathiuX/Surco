name: Release

# Arma los paquetes de los 3 sistemas y los deja como artefactos del run.
# Con un tag `v*` además crea un Release de GitHub con todos los archivos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "crates/app/build.rs"
      - "crates/app/Cargo.toml"
      # El perfil release y las dependencias cambian los binarios.
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  linux:
    # 22.04 (glibc 2.35): el binario corre también en distros más viejas que la última.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de sistema
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Versión
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p surco
      - name: .deb
        run: |
          cargo deb -p surco --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/
      - name: AppImage
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          export PATH="$HOME/.local/bin:$PATH"
          packaging/linux/build-appimage.sh "${{ steps.v.outputs.version }}" dist
      - name: .tar.gz portable
        run: |
          mkdir -p "pkg/surco-${{ steps.v.outputs.version }}"
          cp target/release/surco README.md packaging/linux/surco.desktop packaging/icons/surco-256.png \
            "pkg/surco-${{ steps.v.outputs.version }}/"
          tar -C pkg -czf "dist/surco-${{ steps.v.outputs.version }}-linux-x86_64.tar.gz" \
            "surco-${{ steps.v.outputs.version }}"
      - name: Tamaños
        run: ls -la target/release/surco dist/
      - uses: actions/upload-artifact@v4
        with:
          name: surco-linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versión
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p surco
      - name: .zip portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/surco.exe, README.md `
            -DestinationPath "dist/Surco-${{ steps.v.outputs.version }}-windows-x64-portable.zip"
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # Rutas absolutas: ISCC resuelve /O contra el directorio actual, no el del .iss.
          $exe = (Resolve-Path target\release\surco.exe).Path
          $out = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceExe=$exe" "/O$out" `
            packaging\windows\surco.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tamaños
        run: ls -la target/release/surco.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: surco-windows
          path: dist/*

  macos:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Versión
        id: v
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p surco --target aarch64-apple-darwin
      - run: cargo build --release -p surco --target x86_64-apple-darwin
      - name: Surco.app y .dmg
        run: packaging/macos/build-app.sh "${{ steps.v.outputs.version }}" dist
      - name: Tamaños
        run: ls -la target/*-apple-darwin/release/surco dist/
      - uses: actions/upload-artifact@v4
        with:
          name: surco-macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
