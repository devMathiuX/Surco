name: Repo APT

# Publica el .deb de un Release en el repositorio APT de Surco, servido por
# GitHub Pages desde la rama gh-pages (https://<usuario>.github.io/<repo>).
#
# - Lo llama release.yml después de crear el Release de un tag v*.
# - También se puede correr a mano (Actions > Repo APT > Run workflow) con un
#   tag que ya tenga Release, por ejemplo para publicar uno viejo.
#
# Necesita el secreto APT_GPG_PRIVATE_KEY (clave privada armada, ver
# docs/DEVELOPMENT.md) y, si la clave tiene contraseña, APT_GPG_PASSPHRASE.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      APT_GPG_PRIVATE_KEY:
        required: false
      APT_GPG_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del Release a publicar (por ejemplo v0.3.0)"
        type: string
        required: true

# Una publicación por vez: cada una parte de lo que dejó la anterior.
concurrency:
  group: apt-repo
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      SURCO_APT_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
    steps:
      - name: ¿Está la clave?
        id: key
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::warning::Falta el secreto APT_GPG_PRIVATE_KEY: no se publica el repo APT (ver docs/DEVELOPMENT.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'

      - name: Bajar el .deb del Release
        if: steps.key.outputs.ok == 'true'
        run: |
          mkdir -p new-debs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir new-debs
          ls -la new-debs

      - name: Traer el repo publicado (rama gh-pages)
        if: steps.key.outputs.ok == 'true'
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git --work-tree=site checkout FETCH_HEAD -- .
          fi
          rm -rf site/.git

      - name: Importar la clave GPG
        if: steps.key.outputs.ok == 'true'
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "SURCO_APT_KEY=$fpr" >> "$GITHUB_ENV"
          echo "Clave: $fpr"

      - name: Armar y firmar el repo
        if: steps.key.outputs.ok == 'true'
        run: |
          sudo apt-get install -y apt-utils >/dev/null
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=${GITHUB_REPOSITORY#*/}
          packaging/linux/build-apt-repo.sh new-debs site "https://$owner.github.io/$repo"

      - name: Publicar en gh-pages
        if: steps.key.outputs.ok == 'true'
        run: |
          # Un solo commit, sin historia: los .deb viejos no engordan el repo.
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Repo APT: $TAG"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Activar GitHub Pages (si todavía no está)
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "Pages ya está activo."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
              -f 'source[branch]=gh-pages' -f 'source[path]=/' \
              || echo "::warning::No pude activar Pages solo: activalo en Settings > Pages (rama gh-pages, carpeta /)."
          fi
