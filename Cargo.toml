[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/spotify",
    "crates/resolver",
    "crates/provider",
    "crates/player",
    "crates/storage",
    "crates/app",
    "tools/eval_resolver",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/devMathiuX/Surco"

[workspace.dependencies]
surco-core = { path = "crates/core" }
surco-spotify = { path = "crates/spotify" }
surco-resolver = { path = "crates/resolver" }
surco-provider = { path = "crates/provider" }
surco-player = { path = "crates/player" }
surco-storage = { path = "crates/storage" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tracing-appender = "0.2"
strsim = "0.11"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "process", "time", "sync", "macros", "fs", "io-util"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
directories = "6"
# rodio 0.23 usa symphonia 0.5: decodificamos nosotros con la misma versión.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "x11", "wayland", "tokio", "canvas", "image-without-codecs"] }
# Portadas: solo JPEG (las miniaturas de YouTube).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# MPRIS (Linux, vía zbus: sin libdbus del sistema) y SMTC (Windows).
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
# Selector de archivos nativo (portal XDG en Linux).
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

# Perfil release: tamaño y velocidad. Ver README, sección "Perfil release".
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# "unwind": si un hilo de una dependencia entra en pánico (p. ej. el de D-Bus),
# se cae ese hilo y no la app entera.
panic = "unwind"
strip = true

# Las dependencias se optimizan para tamaño ("s"): red, D-Bus, SQLite, layout…
# no necesitan opt-level 3. La decodificación de audio y el dibujado sí.
[profile.release.package."*"]
opt-level = "s"

[profile.release.package.symphonia-core]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.symphonia-format-isomp4]
opt-level = 3

[profile.release.package.rodio]
opt-level = 3

# El dibujado por CPU corre en cada cuadro: también en 3.
[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.iced_tiny_skia]
opt-level = 3

# Variante optimizada para tamaño, para comparar: `cargo build --profile release-z`
[profile.release-z]
inherits = "release"
opt-level = "z"
